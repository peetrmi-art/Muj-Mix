name: Sync addon release assets

on:
  push:
    branches: ["main"]
    paths:
      - "*.rar"
      - "*.zip"
      - ".github/workflows/release-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Sync addon archives
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          CURRENT: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="downloads"

          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --target main \
              --title "Stajli Addons – soubory ke stažení" \
              --notes "Soubory addonů používané webem Stajli Addons."
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] || git diff --name-only "$BEFORE" "$CURRENT" | grep -Fxq ".github/workflows/release-assets.yml"; then
            shopt -s nullglob
            local_files=(*.rar *.zip)
            existing="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')"

            for file in "${local_files[@]}"; do
              if ! grep -Fxq "$file" <<<"$existing"; then
                gh release upload "$TAG" "$file" --repo "$REPO"
              fi
            done

            while IFS= read -r asset; do
              [[ -z "$asset" ]] && continue
              if [[ ! -f "$asset" ]]; then
                gh release delete-asset "$TAG" "$asset" --repo "$REPO" --yes
              fi
            done <<<"$existing"

            exit 0
          fi

          mapfile -t changed < <(git diff --name-only "$BEFORE" "$CURRENT" -- "*.rar" "*.zip")
          for file in "${changed[@]}"; do
            if [[ -f "$file" ]]; then
              gh release upload "$TAG" "$file" --repo "$REPO" --clobber
            else
              if gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep -Fxq "$file"; then
                gh release delete-asset "$TAG" "$file" --repo "$REPO" --yes
              fi
            fi
          done
